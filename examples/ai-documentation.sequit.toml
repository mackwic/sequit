group = "use-cases"
layoutOrder = "aF"
markdown = '''
Fresh / stale tracking
'''

[nodes.onlyoffice]
nature = "solution"
group = "use-cases"
layoutOrder = "aK"
markdown = '''
OnlyOffice provides 1:1 Word UI and rendering (at least they claim so)
'''

[nodes.all-edits-in-word]
