persistenceFormat = 2

[document]
id = "ai-documentary-effort"
title = "AI for documentary effort"

[layout]
direction = "bottom-to-top"
bias = "top"

[natures.need]
label = "Need"
color = "#f4c400"

[natures.want]
label = "Want"
color = "#ed58c7"

[natures.solution]
label = "Solution"
color = "#6f70e8"

[natures.goal]
label = "Goal"
color = "#12c930"

[natures.precondition]
label = "Precondition"
color = "#8981ec"

[natures.desirable-effect]
label = "Desirable Effect"
color = "#62c985"

[natures.note]
label = "Note"
color = "#f2ea20"

[groups.use-cases]
label = "Use cases"
layoutOrder = "aO"

[groups.data-team]
label = "Data team"
layoutOrder = "a3"

[nodes.traceable-edits]
nature = "need"
group = "use-cases"
layoutOrder = "aM"
markdown = '''
ALCOA+: All edits needs to be tracable
'''

[nodes.training-roi]
nature = "need"
group = "use-cases"
layoutOrder = "aN"
markdown = '''
Training on the software must not overcome the ROI
'''

[nodes.isolated-partner-edits]
nature = "need"
group = "use-cases"
layoutOrder = "aI"
markdown = '''
Keep Partners (Gov, ReSearch, etc.) edits iso
'''

[nodes.documents-live-18-months]
nature = "need"
group = "use-cases"
layoutOrder = "aC"
markdown = '''
Documents live for 18+ months
'''

[nodes.interdependent-sections]
